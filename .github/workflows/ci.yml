# .github/workflows/ci.yml
# Pipeline de Integracao Continua — TechFlow Solutions

name: CI - Testes Automatizados

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do codigo
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Instalar dependencias
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Executar testes
      - name: Executar testes automatizados
        run: python -m pytest tests/ -v

      # 5. Verificar qualidade do codigo
      - name: Verificar sintaxe Python
        run: python -m py_compile src/models.py src/task_manager.py src/notification_service.py
